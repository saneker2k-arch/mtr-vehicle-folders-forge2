plugins {
	id "fabric-loom" version "1.10-SNAPSHOT"
}

version = project.mod_version
group = "com.mtrvehiclefolders"

base {
	archivesName = "mtr-vehicle-folders-fabric-1.19.4"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// MTR использует аннотации javax.annotation, без них компилятор не может прочитать его классы
	compileOnly "com.google.code.findbugs:jsr305:3.0.2"

	// MTR нужен и для компиляции, и для запуска в среде разработки (runClient)
	modCompileOnly files("libs/${project.mtr_jar}")
	modLocalRuntime files("libs/${project.mtr_jar}")
	modLocalRuntime "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
	withSourcesJar()
}
